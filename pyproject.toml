[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "image-batch-processor"
version = "0.1.0"
description = "A powerful batch image processing toolkit - resize, rotate, watermark, format conversion"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Xu Jiaqi", email = "jiaqixu12138@gmail.com" }
]
keywords = ["image", "batch", "processing", "resize", "watermark", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "Pillow>=10.0.0",
    "click>=8.0.0",
]

[project.scripts]
ibp = "image_batch_processor.cli:main"
image-batch-processor = "image_batch_processor.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/Master-626/image-batch-processor"
Repository = "https://github.com/Master-626/image-batch-processor"
Issue-Tracker = "https://github.com/Master-626/image-batch-processor/issues"

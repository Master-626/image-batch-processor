[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "image-batch-processor"
version = "0.2.0"
description = "Local, traceable 2D TIFF microscopy display exports, plus general batch image tools"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Xu Jiaqi", email = "jiaqixu12138@gmail.com" }
]
keywords = ["microscopy", "tiff", "image", "reproducibility", "scale-bar", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "Pillow>=11.0.0",
    "click>=8.0.0",
    "numpy>=1.24.0",
    "tifffile>=2024.8.30",
]

[project.scripts]
ibp-micro = "image_batch_processor.microscopy_cli:main"
ibp = "image_batch_processor.cli:main"
image-batch-processor = "image_batch_processor.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "build>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/Master-626/image-batch-processor"
Repository = "https://github.com/Master-626/image-batch-processor"
Issue-Tracker = "https://github.com/Master-626/image-batch-processor/issues"

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/examples", "/docs", "/.github",
    "/README.md", "/CONTRIBUTING.md", "/CHANGELOG.md", "/LICENSE", "/pyproject.toml", "/.gitignore",
]

[tool.hatch.build.targets.wheel]
packages = ["src/image_batch_processor"]
